name: CI

# 每次推送到 master 与所有 PR 都跑一遍类型检查 + lint + 回归测试。
# 目的:本地忘了跑 npm run check 时,也能在推送后立刻发现回归。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 是原生模块,src/lib/llm.ts 会经 db.ts 间接引入,
      # 所以这里必须完整安装依赖,不能用 --omit=dev。
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test
